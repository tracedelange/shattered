id: quest_silence_the_screaming_melody
name: Silence the Screaming Melody
giver: desert_hermit
zone: zone_24_12
description: |
  The Crazed Hermit is driven mad by a deafening sound emanating from the Prism Spire. He begs you to climb the glass tower and silence the source of the noise.
stages:
  - id: stage_start
    text: Speak with the Crazed Hermit.
    on_complete: stage_reach_spire
  - id: stage_reach_spire
    text: Reach the summit of the Prism Spire.
    on_complete: stage_kill_guardian
    objective:
      kind: reach
      radius: 10
      zone: zone_24_12_prism_spire
      template_id: crystalline_guardian
  - id: stage_kill_guardian
    text: Slay the Crystalline Guardian to stop the melody.
    on_complete: stage_return
    objective:
      kind: kill_specific
      target_id: crystalline_guardian
  - id: stage_return
    text: Return to the Hermit with news of the silence.
rewards:
  - gold: 500
  - xp: 1000
  - item: resonating_glass_shard
