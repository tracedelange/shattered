id: the_oasis_toll
name: The Oasis Toll
giver: oasis_smith
zone: village_24_8
description: |
  The village gates are rusting and weak. Smithy Thane needs iron scrap from the surrounding lands to forge reinforcements and keep the settlement secure.
stages:
  - id: start
    text: Speak with Smithy Thane.
  - id: collect_iron
    text: Gather iron scrap for the smith.
    on_complete: report_back
    objective:
      kind: collect_count
      item_base: iron_scrap
      target: 5
  - id: report_back
    text: Return to Smithy Thane with the iron.
rewards:
  - gold: 100
  - xp: 50
