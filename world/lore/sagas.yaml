    motif: |
      The desert winds carry a melodic hum. Where the sand turns to iridescent glass, things that were once organic have become brittle, translucent, and hungry.
    secret: |
      A long-dead celestial entity crashed here, not as a god, but as a fragment of a mirror. Its presence crystallizes the living and traps echoes of the past in the glass.
