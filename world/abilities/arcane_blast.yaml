# Wizard tier-3 — a heavy nuke that saps the target's vitality rather than
# burning/freezing it. High mana, long range, big damage. `arcane_damage` was
# folded into `negative_damage` when the brand array expanded to the DCSS-aligned
# 7 types — the name/flavor stays "Arcane Blast", only the brand tag changed.
id: arcane_blast
name: "Arcane Blast"
actor: player
class: wizard
targeting: { shape: projectile, range: 7 }
cast: { cost: { mana: 12 }, cooldown_ticks: 45 }
effects:
  - kind: damage
    base: [10, 16]
    scaling: { intelligence: A }
    brand: negative_damage
ranks:
  - { rank: 1, requires_level: 5,  cost_gold: 250,   power_mult: 1.0 }
  - { rank: 2, requires_level: 8,  cost_gold: 550,   power_mult: 1.4 }
  - { rank: 3, requires_level: 11, cost_gold: 1100,  power_mult: 1.8 }
  - { rank: 4, requires_level: 14, cost_gold: 1800,  power_mult: 2.2 }
