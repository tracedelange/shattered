# Wizard tier-5 — the caster's kiting tool: a light area hit that roots
# everything it lands on, buying the range a wizard needs to keep casting.
# origin: caster, because a nova bursts from the caster — the point is to root
# what has already closed on YOU, so measuring the radius from a distant target
# would root the wrong things entirely. The
# damage is deliberately C-grade; the root is the point, and it's held to the
# short-duration / long-cooldown bar CC is authored against (see the CC section
# of docs/abilities-reference.md).
id: frost_nova
name: "Frost Nova"
actor: player
class: wizard
targeting: { shape: area, range: 5, radius: 2, origin: caster }
cast: { cost: { mana: 22 }, cooldown_ticks: 100 }
effects:
  - kind: damage
    base: [5, 9]
    scaling: { intelligence: C }
    brand: cold_damage
  - kind: modifier
    stats: {}
    duration_ticks: 25
    cc: [root]
ranks:
  - { rank: 1, requires_level: 10, cost_gold: 800,  power_mult: 1.0 }
  - { rank: 2, requires_level: 13, cost_gold: 1500, power_mult: 1.4 }
  - { rank: 3, requires_level: 16, cost_gold: 2400, power_mult: 1.8 }
  - { rank: 4, requires_level: 19, cost_gold: 3400, power_mult: 2.2 }
