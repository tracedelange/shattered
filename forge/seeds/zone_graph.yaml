# Forge seed graph — the origin the world grows from.
# Single tier-1 village at the coordinate origin. It has no links (every cardinal
# edge is open), so it is a frontier zone the grower can attach a region to.
# Growth extends north (decreasing Y, into negative coords) and ramps up in tier.
zones:
  - id: zone_0_0
    biome: village
    seed: origin_0_0
    level_band: {tier: 1, minLevel: 1, maxLevel: 5}
    links: []
    features: []
