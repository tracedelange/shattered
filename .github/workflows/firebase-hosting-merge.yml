# Originally auto-generated by the Firebase CLI (`firebase init hosting:github`)
# https://github.com/firebase/firebase-tools
#
# EDITED after generation — re-running the CLI will overwrite this file, so
# re-add the build steps below if it does. As generated it went straight from
# checkout to deploy, but firebase.json's public dir (client/dist) is a build
# artifact and gitignored: the deploy would have published an empty directory
# over the live site.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One live deploy at a time; a newer push supersedes an in-flight one rather
# than racing it to the same channel.
concurrency:
  group: deploy-hosting-live
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VITE_SERVER_URL is baked into the bundle at build time — a build input,
      # not a runtime one, so retargeting the game server needs a redeploy.
      # Override with a repo variable of the same name; the fallback is the URL
      # scripts/deploy-client.sh hardcodes.
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://soup.graphon.io' }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRON_BROTH }}
          channelId: live
          projectId: iron-broth
