# Merge to main is live. This is the CI version of scripts/deploy-client.sh,
# which still works from a developer machine for an off-cycle push.
#
# Versioning/changelog (release.yml) runs independently and is not a gate: a
# merge ships immediately whether or not a version has been stamped for it.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One live deploy at a time; a newer push supersedes an in-flight one rather
# than racing it to the same channel.
concurrency:
  group: deploy-hosting-live
  cancel-in-progress: true

jobs:
  hosting:
    # Skip release-please's own release commit. It changes only CHANGELOG.md,
    # the version and the manifest, so the built bundle is byte-identical to
    # what is already live (vite doesn't embed the version) — deploying it again
    # is the one redundant deploy this setup would otherwise have. Matching the
    # commit subject rather than paths on purpose: a paths filter over
    # package.json would also swallow dependency bumps, which DO need shipping.
    # `contains`, not `startsWith`: on a merge commit GitHub puts the PR title
    # in the BODY ("Merge pull request #12 from ...\n\nchore(main): release
    # 0.2.0"), so a subject-anchored match only ever fired for squash merges.
    # (quoted: the ": " inside the literal would otherwise parse as a YAML
    # mapping)
    if: "${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VITE_SERVER_URL is baked into the bundle at build time — a build input,
      # not a runtime one, so retargeting the game server needs a redeploy.
      # Override with a repo variable of the same name; the fallback is the URL
      # scripts/deploy-client.sh hardcodes.
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://soup.graphon.io' }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRON_BROTH }}
          channelId: live
          projectId: iron-broth
