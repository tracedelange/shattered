# Changelog + version + tag, and nothing else. Deploying is deliberately NOT
# wired to this: merge to main is live (see deploy.yml). This runs alongside it,
# maintaining a standing release PR that accumulates CHANGELOG.md entries and
# the package.json bump from the Conventional Commit types since the last
# release. Merge that PR whenever you want to stamp a version; it tags and
# creates the GitHub release.
#
# It does not recurse: the release PR's own commit is `chore(main): release
# X.Y.Z`, and `chore` is not a releasable type, so the next run finds nothing
# to release and opens nothing.
#
# NOTE: `firebase init hosting:github` regenerates its own hosting workflows (a
# push-to-main deploy and a PR preview), both without a build step even though
# firebase.json's public dir is a gitignored build artifact. Delete them again
# after any CLI re-run — deploy.yml is the one that should exist.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # The default GITHUB_TOKEN can push release-please's branch but not
          # open its PR — "GitHub Actions is not permitted to create or approve
          # pull requests" — which blocks the release and therefore the deploy
          # below. Two ways out; this line supports both without a further edit:
          #   1. Set a RELEASE_PLEASE_TOKEN secret (fine-grained PAT, contents +
          #      pull-requests write). Keeps the review gate intact.
          #   2. Or flip Settings > Actions > General > Workflow permissions >
          #      "Allow GitHub Actions to create and approve pull requests",
          #      leave the secret unset, and the fallback below applies. One
          #      click, but it lets any workflow approve PRs too.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

