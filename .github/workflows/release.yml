# Auto-changelog + release on main. release-please reads the Conventional
# Commit types enforced by commitlint (see commitlint.config.js) to derive the
# version bump, then maintains a standing "release PR" that accumulates the
# CHANGELOG.md entries and the package.json bump. Merging that PR is what cuts
# the release: it tags and creates the GitHub release.
#
# Deliberately release-only: it does NOT deploy. Coupling the Firebase client
# deploy (scripts/deploy-client.sh) to a release would mean adding a job here
# gated on `needs.release.outputs.release_created`, not a separate workflow on
# `release: published` — a release created with GITHUB_TOKEN does not trigger
# other workflows. It would also need a Firebase credential secret, which this
# repo doesn't have in CI yet (deploys are run from a developer machine today).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
