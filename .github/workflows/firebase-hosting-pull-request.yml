# Originally auto-generated by the Firebase CLI (`firebase init hosting:github`)
# https://github.com/firebase/firebase-tools
#
# EDITED after generation — same reason as firebase-hosting-merge.yml: the
# generated version deployed without building, and client/dist is a gitignored
# build artifact, so every preview would have been empty.
#
# Deploys each PR to its own preview channel and comments the URL. The `if`
# guard skips PRs from forks, which have no access to the service account
# secret and would fail rather than preview.
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL || 'https://soup.graphon.io' }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRON_BROTH }}
          projectId: iron-broth
