<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>World Gen Workbench</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; height: 100vh; overflow: hidden; }

    #sidebar {
      width: 260px; min-width: 260px; background: #16213e; padding: 16px;
      display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
      border-right: 1px solid #0f3460;
    }

    h1 { font-size: 14px; letter-spacing: 2px; color: #e94560; text-transform: uppercase; }

    .section { display: flex; flex-direction: column; gap: 8px; }
    .section-label { font-size: 10px; letter-spacing: 1px; color: #888; text-transform: uppercase; border-bottom: 1px solid #0f3460; padding-bottom: 4px; }

    label { font-size: 12px; display: flex; flex-direction: column; gap: 3px; color: #ccc; }
    input[type=text], input[type=number] {
      background: #0f3460; border: 1px solid #e94560; color: #e0e0e0;
      padding: 5px 8px; font-family: inherit; font-size: 12px; border-radius: 3px;
    }
    input[type=range] { width: 100%; accent-color: #e94560; }
    .range-row { display: flex; justify-content: space-between; align-items: center; }
    .range-val { font-size: 11px; color: #e94560; min-width: 36px; text-align: right; }

    button {
      background: #e94560; color: #fff; border: none; padding: 10px;
      font-family: inherit; font-size: 12px; letter-spacing: 1px; cursor: pointer;
      text-transform: uppercase; border-radius: 3px;
    }
    button:hover { background: #c73652; }

    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    #canvas-wrap { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; background: #0d1117; }
    canvas { image-rendering: pixelated; cursor: crosshair; }

    #tooltip {
      position: fixed; background: #16213e; border: 1px solid #e94560;
      padding: 8px 12px; font-size: 11px; pointer-events: none;
      display: none; z-index: 10; border-radius: 3px; line-height: 1.6;
    }

    #status-bar {
      height: 28px; background: #16213e; border-top: 1px solid #0f3460;
      padding: 0 14px; font-size: 11px; color: #888;
      display: flex; align-items: center; gap: 16px;
    }

    .legend { display: flex; flex-wrap: wrap; gap: 6px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 2px; }

    .zoom-row { display: flex; align-items: center; gap: 6px; }
    .zoom-btn {
      background: #0f3460; color: #e0e0e0; border: 1px solid #e94560;
      width: 28px; height: 28px; font-size: 16px; line-height: 1;
      cursor: pointer; border-radius: 3px; padding: 0; text-align: center;
    }
    .zoom-btn:hover { background: #e94560; color: #fff; }
    .zoom-btn.active { background: #e94560; color: #fff; }
    #zoom-label { font-size: 12px; color: #e94560; min-width: 44px; text-align: center; }
  </style>
</head>
<body>

<div id="sidebar">
  <h1>World Gen</h1>

  <div class="section">
    <div class="section-label">Mode</div>
    <div class="zoom-row">
      <button class="zoom-btn mode-btn active" id="mode-zone" style="width:auto;padding:0 10px;font-size:11px;">Zone Grid</button>
      <button class="zoom-btn mode-btn" id="mode-wild" style="width:auto;padding:0 10px;font-size:11px;">Continuous Wild</button>
    </div>
  </div>

  <div id="wild-controls" style="display:none;flex-direction:column;gap:14px;">
    <div class="section">
      <div class="section-label">Seed</div>
      <div style="display:flex;gap:6px;align-items:center;">
        <input type="text" id="wild-seed" value="silicon-soup"
          title="Root value driving the shared field generator (shared/worldgen). Same seed the game server uses."
          style="flex:1;background:#0f3460;border:1px solid #e94560;color:#e0e0e0;padding:5px 8px;font-family:inherit;font-size:12px;border-radius:3px;" />
      </div>
    </div>

    <div class="section">
      <div class="section-label">Viewport</div>
      <label title="World-tile X of the viewport center.">Center X
        <input type="number" id="wild-cx" value="0" step="10" />
      </label>
      <label title="World-tile Y of the viewport center.">Center Y
        <input type="number" id="wild-cy" value="0" step="10" />
      </label>
      <label title="Half-width of the viewport in world tiles. Bigger = zoomed out further. Scroll wheel over the canvas also zooms.">Radius (tiles)
        <input type="number" id="wild-radius" value="500" min="4" max="100000" step="50" />
      </label>
      <label title="Sample resolution — how many field samples per axis. Higher = crisper detail, slower to generate.">Samples
        <div class="range-row">
          <input type="range" id="wild-samples" min="64" max="1024" step="32" value="512" />
          <span class="range-val" id="wild-samples-val">512</span>
        </div>
      </label>
      <button id="wild-origin-btn" style="margin-top:2px;">Center on Origin</button>
    </div>

    <div class="section">
      <div class="section-label">View</div>
      <div class="zoom-row">
        <button class="zoom-btn wild-view-btn active" id="wild-view-biome" style="width:auto;padding:0 10px;font-size:11px;">Biome</button>
        <button class="zoom-btn wild-view-btn" id="wild-view-danger" style="width:auto;padding:0 10px;font-size:11px;">Danger</button>
        <button class="zoom-btn wild-view-btn" id="wild-view-weird" style="width:auto;padding:0 10px;font-size:11px;">Weirdness</button>
      </div>
      <div style="font-size:10px;color:#888;">Click canvas to recenter · scroll to zoom</div>
    </div>

    <div class="section">
      <div class="section-label">Noise (shared/worldgen/field.ts)</div>

      <label title="Feature size of the elevation field (tiles). Bigger = broader continents/coastlines. Smaller = choppier, patchy terrain.">Elevation scale
        <div class="range-row">
          <input type="range" id="wild-elevScale" min="20" max="1200" step="10" value="220" />
          <span class="range-val" id="wild-elevScale-val">220</span>
        </div>
      </label>

      <label title="Feature size of the temperature+moisture fields (tiles). Usually larger than elevation scale so biome regions span multiple terrain features.">Climate scale
        <div class="range-row">
          <input type="range" id="wild-climateScale" min="20" max="2000" step="10" value="420" />
          <span class="range-val" id="wild-climateScale-val">420</span>
        </div>
      </label>

      <label title="Noise layers stacked for all three fields. More octaves add finer detail on top of the broad shape.">Octaves
        <div class="range-row">
          <input type="range" id="wild-octaves" min="1" max="8" step="1" value="4" />
          <span class="range-val" id="wild-octaves-val">4</span>
        </div>
      </label>

      <label title="Amplitude falloff per octave. Higher = rougher, more chaotic. Lower = smoother, rounder.">Persistence
        <div class="range-row">
          <input type="range" id="wild-persistence" min="0.1" max="1.0" step="0.05" value="0.5" />
          <span class="range-val" id="wild-persistence-val">0.50</span>
        </div>
      </label>

      <label title="Frequency multiplier per octave. Higher = more fine detail per layer.">Lacunarity
        <div class="range-row">
          <input type="range" id="wild-lacunarity" min="1.0" max="4.0" step="0.1" value="2.0" />
          <span class="range-val" id="wild-lacunarity-val">2.0</span>
        </div>
      </label>

      <label title="Shifts elevation up (more land/mountain) or down (more ocean).">Elevation bias
        <div class="range-row">
          <input type="range" id="wild-elevBias" min="-0.5" max="0.5" step="0.01" value="0" />
          <span class="range-val" id="wild-elevBias-val">0.00</span>
        </div>
      </label>

      <label title="Stretches elevation away from the midpoint before the sea/mountain thresholds apply. Higher = sharper coastlines and more dramatic peaks.">Elevation contrast
        <div class="range-row">
          <input type="range" id="wild-elevContrast" min="0.5" max="3.0" step="0.05" value="1.5" />
          <span class="range-val" id="wild-elevContrast-val">1.50</span>
        </div>
      </label>

      <label title="Shifts temperature globally. Positive = warmer (more desert/swamp), negative = colder (more tundra).">Temp bias
        <div class="range-row">
          <input type="range" id="wild-tempBias" min="-0.5" max="0.5" step="0.01" value="0" />
          <span class="range-val" id="wild-tempBias-val">0.00</span>
        </div>
      </label>

      <label title="Spreads temperature away from the midpoint so more of the biome table is reached. 1.0 = off (raw noise clusters near mid → grassland/plains monoculture).">Temp contrast
        <div class="range-row">
          <input type="range" id="wild-tempContrast" min="0.5" max="3.0" step="0.05" value="1.7" />
          <span class="range-val" id="wild-tempContrast-val">1.70</span>
        </div>
      </label>

      <label title="Shifts moisture globally. Positive = wetter (more forest/swamp), negative = drier (more plains/desert).">Moisture bias
        <div class="range-row">
          <input type="range" id="wild-moistBias" min="-0.5" max="0.5" step="0.01" value="0" />
          <span class="range-val" id="wild-moistBias-val">0.00</span>
        </div>
      </label>

      <label title="Spreads moisture away from the midpoint so more of the biome table is reached.">Moisture contrast
        <div class="range-row">
          <input type="range" id="wild-moistContrast" min="0.5" max="3.0" step="0.05" value="1.7" />
          <span class="range-val" id="wild-moistContrast-val">1.70</span>
        </div>
      </label>

      <label title="Feature size of the weirdness field (tiles). Deliberately smaller/higher-frequency than elevation scale so weird pockets cut across biome boundaries at an angle instead of tracking them.">Weirdness scale
        <div class="range-row">
          <input type="range" id="wild-weirdScale" min="5" max="600" step="5" value="73" />
          <span class="range-val" id="wild-weirdScale-val">73</span>
        </div>
      </label>

      <label title="abs(folded weirdness) above this overrides the climate-picked biome with badlands, regardless of temp/moisture. Lower = more badlands coverage.">Weirdness threshold
        <div class="range-row">
          <input type="range" id="wild-weirdThreshold" min="0" max="1" step="0.02" value="0.55" />
          <span class="range-val" id="wild-weirdThreshold-val">0.55</span>
        </div>
      </label>

      <button id="wild-reset-defaults-btn" style="margin-top:2px;background:#7f8c8d;" title="Reset sliders to the live game's shipped config.ts values">Reset to Shipped Defaults</button>
      <button id="wild-copy-config-btn" style="margin-top:2px;background:#2980b9;" title="Copy a shared/worldgen/config.ts snippet with the current slider values, to hand-paste in and ship them">Copy as config.ts Snippet</button>
      <div id="wild-copy-status" style="font-size:11px;color:#aaa;min-height:14px;"></div>
    </div>

    <div class="section">
      <div class="section-label">Danger Bands</div>
      <div class="legend" id="wild-band-legend"></div>
    </div>

    <div class="section">
      <div class="section-label">Legend</div>
      <div class="legend" id="wild-legend"></div>
    </div>

    <button id="wild-generate">Generate</button>
  </div>

  <div id="zone-controls" style="display:contents;">

  <div class="section">
    <div class="section-label">Seed</div>
    <div style="display:flex;gap:6px;align-items:center;">
      <input type="text" id="seed" placeholder="8-char hex…"
        title="Root value driving all randomness. The same seed always produces the same world."
        style="flex:1;background:#0f3460;border:1px solid #e94560;color:#e0e0e0;padding:5px 8px;font-family:inherit;font-size:12px;border-radius:3px;" />
      <button class="zoom-btn" id="randomize-btn" title="Generate a new random seed and regenerate" style="font-size:14px;">⟳</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Grid</div>
    <label title="Number of zone columns. Each cell becomes one ~100×100 tile overworld zone.">Columns
      <input type="number" id="cols" value="50" min="2" max="1000" />
    </label>
    <label title="Number of zone rows. Each cell becomes one ~100×100 tile overworld zone.">Rows
      <input type="number" id="rows" value="50" min="2" max="1000" />
    </label>
  </div>

  <div class="section">
    <div class="section-label">Noise</div>

    <label title="Controls geographic feature size. Higher = broad continent-scale biomes. Lower = small, patchy terrain.">Scale
      <div class="range-row">
        <input type="range" id="scale" min="0.05" max="1.5" step="0.01" value="0.35" />
        <span class="range-val" id="scale-val">0.35</span>
      </div>
    </label>

    <label title="Number of noise layers stacked. More octaves add finer terrain detail on top of broader shapes.">Octaves
      <div class="range-row">
        <input type="range" id="octaves" min="1" max="8" step="1" value="5" />
        <span class="range-val" id="octaves-val">5</span>
      </div>
    </label>

    <label title="Amplitude falloff per octave. Higher = rougher, more chaotic terrain. Lower = smoother, rounder shapes.">Persistence
      <div class="range-row">
        <input type="range" id="persistence" min="0.1" max="1.0" step="0.05" value="0.5" />
        <span class="range-val" id="persistence-val">0.50</span>
      </div>
    </label>

    <label title="Frequency multiplier per octave. Higher = more fine-grained detail per layer. Lower = gradual transitions.">Lacunarity
      <div class="range-row">
        <input type="range" id="lacunarity" min="1.0" max="4.0" step="0.1" value="2.0" />
        <span class="range-val" id="lacunarity-val">2.0</span>
      </div>
    </label>

    <label title="Shifts all elevation values up (more land / mountains) or down (more ocean). Applied after the boundary mask. Below ~0.18 the ocean border forms — needed for coastline and rivers.">Elevation bias
      <div class="range-row">
        <input type="range" id="elevationBias" min="-0.5" max="0.5" step="0.01" value="0.18" />
        <span class="range-val" id="elevationBias-val">0.18</span>
      </div>
    </label>

    <label title="Amplifies elevation differences around the midpoint. Higher values create sharper coastlines and more dramatic peninsulas.">Elevation contrast
      <div class="range-row">
        <input type="range" id="elevationContrast" min="0.5" max="3.0" step="0.05" value="1.6" />
        <span class="range-val" id="elevationContrast-val">1.60</span>
      </div>
    </label>

    <label title="Shifts the temperature noise globally. Positive = warmer world (more desert/swamp). Negative = colder world (more tundra).">Temp bias
      <div class="range-row">
        <input type="range" id="temperatureBias" min="-0.5" max="0.5" step="0.01" value="0" />
        <span class="range-val" id="temperatureBias-val">0.00</span>
      </div>
    </label>

    <label title="Spreads temperature noise away from the midpoint so more of the biome table is reached (counters the grassland monoculture). 1.0 = off.">Temp contrast
      <div class="range-row">
        <input type="range" id="temperatureContrast" min="0.5" max="3.0" step="0.05" value="1.7" />
        <span class="range-val" id="temperatureContrast-val">1.70</span>
      </div>
    </label>

    <label title="Shifts the moisture noise globally. Positive = wetter world (more forest/swamp). Negative = drier world (more plains/desert).">Moisture bias
      <div class="range-row">
        <input type="range" id="moistureBias" min="-0.5" max="0.5" step="0.01" value="0" />
        <span class="range-val" id="moistureBias-val">0.00</span>
      </div>
    </label>

    <label title="Spreads moisture noise away from the midpoint so more of the biome table is reached (counters the grassland monoculture). 1.0 = off.">Moisture contrast
      <div class="range-row">
        <input type="range" id="moistureContrast" min="0.5" max="3.0" step="0.05" value="1.7" />
        <span class="range-val" id="moistureContrast-val">1.70</span>
      </div>
    </label>

    <label title="Ocean: edges become sea, land is inland. Mountain: edges become peaks, interior is open.">Boundary
      <select id="boundaryStyle" style="background:#0f3460;border:1px solid #e94560;color:#e0e0e0;padding:5px 8px;font-family:inherit;font-size:12px;border-radius:3px;">
        <option value="ocean">Ocean</option>
        <option value="mountain">Mountain</option>
      </select>
    </label>
  </div>

  <div class="section">
    <div class="section-label">Settlements</div>

    <label title="Number of cities placed in tier 1–2 biomes, far apart from each other.">Cities
      <input type="number" id="cityCount" value="3" min="0" max="500" />
    </label>

    <label title="Number of villages scattered across habitable biomes.">Villages
      <input type="number" id="villageCount" value="8" min="0" max="2000" />
    </label>
  </div>

  <div class="section">
    <div class="section-label">Progression</div>
    <label title="Radial: level rises with distance from the coast. Linear: level ramps along one axis.">Mode
      <select id="progressionMode" style="background:#0f3460;border:1px solid #e94560;color:#e0e0e0;padding:5px 8px;font-family:inherit;font-size:12px;border-radius:3px;">
        <option value="radial">Radial (coast distance)</option>
        <option value="linear">Linear (axis)</option>
      </select>
    </label>
    <label id="progressionDir-label" title="Direction of increasing level for linear mode." style="display:none;">Direction
      <select id="progressionDir" style="background:#0f3460;border:1px solid #e94560;color:#e0e0e0;padding:5px 8px;font-family:inherit;font-size:12px;border-radius:3px;">
        <option value="WE">West → East</option>
        <option value="EW">East → West</option>
        <option value="NS">North → South</option>
        <option value="SN">South → North</option>
      </select>
    </label>
  </div>

  <div class="section">
    <div class="section-label">View</div>
    <div class="zoom-row">
      <button class="zoom-btn view-btn active" id="view-biome" style="width:auto;padding:0 10px;font-size:11px;">Biome</button>
      <button class="zoom-btn view-btn" id="view-level" style="width:auto;padding:0 10px;font-size:11px;">Level</button>
    </div>
  </div>

  <button id="generate">Generate</button>
  <button id="save-defaults-btn" style="margin-top:4px;background:#2980b9;" title="Save current params as defaults for next load">Save Defaults</button>
  <button id="export-btn" style="margin-top:4px;background:#27ae60;" title="Write zone files for all settlements to world/zones/">Export Zones</button>
  <button id="export-yaml-btn" style="margin-top:4px;background:#16a085;" title="Write a single world/world.yaml in the zones: graph schema">Export YAML</button>
  <div id="export-status" style="font-size:11px;color:#aaa;margin-top:4px;min-height:16px;"></div>
  <div id="override-info" style="font-size:11px;color:#aaa;margin-top:2px;min-height:14px;"></div>

  <div class="section">
    <div class="section-label">Zoom</div>
    <div class="zoom-row">
      <button class="zoom-btn" id="zoom-out">−</button>
      <span id="zoom-label">100%</span>
      <button class="zoom-btn" id="zoom-in">+</button>
      <button class="zoom-btn" id="zoom-reset" title="Reset zoom" style="width:auto;padding:0 8px;font-size:11px;">1:1</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Legend</div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="section">
    <div class="section-label">Biome Table</div>
    <div style="font-size:10px;color:#888;margin-bottom:4px;">temp → / moisture ↑</div>
    <canvas id="biome-table-canvas" width="220" height="140" style="display:block;border:1px solid #333;cursor:crosshair;"></canvas>
    <div id="biome-table-hover" style="font-size:10px;color:#aaa;min-height:14px;margin-top:3px;"></div>
    <div style="margin-top:6px;font-size:10px;color:#888;margin-bottom:3px;">Area coverage</div>
    <canvas id="biome-coverage-canvas" width="220" height="16" style="display:block;border:1px solid #333;"></canvas>
    <div id="biome-coverage-labels" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;"></div>
  </div>
  </div>
</div>

<div id="main">
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
  <div id="status-bar">
    <span id="status">Ready</span>
    <span id="cell-info"></span>
  </div>
</div>

<div id="tooltip"></div>

<div id="cell-editor" style="position:fixed;display:none;z-index:20;background:#16213e;border:1px solid #e94560;border-radius:4px;padding:10px;width:200px;font-size:11px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,0.5);">
  <div id="cell-editor-title" style="color:#e94560;font-weight:bold;margin-bottom:6px;"></div>
  <label style="font-size:11px;">Biome
    <select id="ce-biome" style="background:#0f3460;border:1px solid #e94560;color:#e0e0e0;padding:3px 6px;font-family:inherit;font-size:11px;border-radius:3px;width:100%;">
      <option value="">— keep —</option>
      <option value="ocean">ocean</option>
      <option value="tundra">tundra</option>
      <option value="plains">plains</option>
      <option value="grassland">grassland</option>
      <option value="forest">forest</option>
      <option value="swamp">swamp</option>
      <option value="desert">desert</option>
      <option value="mountain">mountain</option>
    </select>
  </label>
  <label style="font-size:11px;margin-top:6px;">Tier
    <select id="ce-tier" style="background:#0f3460;border:1px solid #e94560;color:#e0e0e0;padding:3px 6px;font-family:inherit;font-size:11px;border-radius:3px;width:100%;">
      <option value="">— keep —</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </label>
  <div style="display:flex;gap:6px;margin-top:6px;">
    <label style="font-size:11px;flex:1;">Min lv
      <input type="number" id="ce-min" min="1" max="100" style="background:#0f3460;border:1px solid #e94560;color:#e0e0e0;padding:3px 6px;font-family:inherit;font-size:11px;border-radius:3px;width:100%;" />
    </label>
    <label style="font-size:11px;flex:1;">Max lv
      <input type="number" id="ce-max" min="1" max="100" style="background:#0f3460;border:1px solid #e94560;color:#e0e0e0;padding:3px 6px;font-family:inherit;font-size:11px;border-radius:3px;width:100%;" />
    </label>
  </div>
  <div style="display:flex;gap:6px;margin-top:8px;">
    <button id="ce-apply" style="flex:1;padding:6px;font-size:11px;">Apply</button>
    <button id="ce-clear" style="flex:1;padding:6px;font-size:11px;background:#7f8c8d;">Clear</button>
    <button id="ce-close" style="flex:0 0 auto;padding:6px 8px;font-size:11px;background:#0f3460;">✕</button>
  </div>
</div>

<script type="module">
import { BIOME_COLORS, TIER_COLORS, TIER_LABELS, SETTLEMENT_STYLE, renderWorldGrid } from '/shared/world-renderer.js';

let viewMode = 'biome'; // 'biome' | 'level'

// ── Biome table diagram ───────────────────────────────────────────────────────
const BIOME_TABLE_DATA = [
  [0.0,  0.25, 0.0,  1.0,  'tundra'],
  [0.25, 0.45, 0.0,  0.3,  'plains'],
  [0.25, 0.45, 0.3,  0.6,  'grassland'],
  [0.25, 0.45, 0.6,  1.0,  'forest'],
  [0.45, 0.65, 0.0,  0.25, 'desert'],
  [0.45, 0.65, 0.25, 0.5,  'plains'],
  [0.45, 0.65, 0.5,  0.75, 'grassland'],
  [0.45, 0.65, 0.75, 1.0,  'swamp'],
  [0.65, 1.0,  0.0,  0.3,  'desert'],
  [0.65, 1.0,  0.3,  0.6,  'plains'],
  [0.65, 1.0,  0.6,  0.8,  'grassland'],
  [0.65, 1.0,  0.8,  1.0,  'swamp'],
];

function classifyBiomeTable(temp, moisture) {
  for (const [tMin, tMax, mMin, mMax, biome] of BIOME_TABLE_DATA) {
    if (temp >= tMin && temp < tMax && moisture >= mMin && moisture < mMax) return biome;
  }
  return 'plains';
}

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function drawBiomeTable() {
  const canvas = document.getElementById('biome-table-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const img = ctx.createImageData(W, H);

  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      const temp     = px / W;
      const moisture = 1 - py / H; // invert: wet at top
      const biome    = classifyBiomeTable(temp, moisture);
      const [r, g, b] = hexToRgb(BIOME_COLORS[biome] ?? '#333333');
      const i = (py * W + px) * 4;
      img.data[i] = r; img.data[i+1] = g; img.data[i+2] = b; img.data[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  // Gridlines at temperature break points.
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  for (const t of [0.25, 0.45, 0.65]) {
    const x = Math.round(t * W) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // Coverage bar.
  const coverage = {};
  for (const [tMin, tMax, mMin, mMax, biome] of BIOME_TABLE_DATA) {
    coverage[biome] = (coverage[biome] ?? 0) + (tMax - tMin) * (mMax - mMin);
  }
  const cCanvas = document.getElementById('biome-coverage-canvas');
  const cCtx = cCanvas.getContext('2d');
  const cW = cCanvas.width, cH = cCanvas.height;
  let x = 0;
  const sorted = Object.entries(coverage).sort((a, b) => b[1] - a[1]);
  for (const [biome, frac] of sorted) {
    const w = frac * cW;
    cCtx.fillStyle = BIOME_COLORS[biome] ?? '#333';
    cCtx.fillRect(x, 0, w, cH);
    x += w;
  }

  // Coverage labels.
  const labelsEl = document.getElementById('biome-coverage-labels');
  labelsEl.innerHTML = sorted.map(([biome, frac]) =>
    `<span style="font-size:10px;color:${BIOME_COLORS[biome]};white-space:nowrap">${biome} ${(frac*100).toFixed(0)}%</span>`
  ).join('');
}

// Biome table hover: show biome at cursor position.
document.getElementById('biome-table-canvas').addEventListener('mousemove', e => {
  const canvas = e.currentTarget;
  const rect = canvas.getBoundingClientRect();
  const temp     = (e.clientX - rect.left)  / rect.width;
  const moisture = 1 - (e.clientY - rect.top) / rect.height;
  const biome = classifyBiomeTable(Math.max(0,Math.min(1,temp)), Math.max(0,Math.min(1,moisture)));
  document.getElementById('biome-table-hover').textContent =
    `temp ${temp.toFixed(2)}  moisture ${moisture.toFixed(2)}  → ${biome}`;
});
document.getElementById('biome-table-canvas').addEventListener('mouseleave', () => {
  document.getElementById('biome-table-hover').textContent = '';
});

const BASE_CELL_PX = 32;
const ZOOM_STEPS = [0.03125, 0.0625, 0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4, 6, 8, 12, 16];
let zoomIdx = ZOOM_STEPS.indexOf(1); // start at 100%

function cellPx() { return Math.round(BASE_CELL_PX * ZOOM_STEPS[zoomIdx]); }

function updateZoomLabel() {
  document.getElementById('zoom-label').textContent = Math.round(ZOOM_STEPS[zoomIdx] * 100) + '%';
}

function applyZoom(delta) {
  zoomIdx = Math.max(0, Math.min(ZOOM_STEPS.length - 1, zoomIdx + delta));
  updateZoomLabel();
  if (world) render(world);
}

// Pick the largest zoom where the canvas fits within the viewport (minus sidebar + statusbar).
// Browser canvas max dimension is ~16384px; we stay well under that.
function autoFitZoom(w) {
  const maxW = window.innerWidth  - 260 - 32; // sidebar + some padding
  const maxH = window.innerHeight -  28 - 32; // statusbar + some padding
  // Find highest zoom where both dimensions fit
  let best = 0;
  for (let i = ZOOM_STEPS.length - 1; i >= 0; i--) {
    const px = Math.round(BASE_CELL_PX * ZOOM_STEPS[i]);
    if (w.cols * px <= maxW && w.rows * px <= maxH) { best = i; break; }
  }
  zoomIdx = best;
  updateZoomLabel();
}

function randomSeed() {
  return Math.floor(Math.random() * 0xFFFFFFFF).toString(16).padStart(8, '0');
}

let world = null;

// Manual per-cell overrides, keyed "x_y" → { x, y, biome?, tier?, minLevel?, maxLevel? }.
const overrides = new Map();
function updateOverrideInfo() {
  const n = overrides.size;
  document.getElementById('override-info').textContent = n ? `${n} manual override${n !== 1 ? 's' : ''} active` : '';
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
const scheduleGenerate = debounce(() => generate(), 180);

function bindRange(id) {
  const el = document.getElementById(id);
  const val = document.getElementById(id + '-val');
  el.addEventListener('input', () => {
    val.textContent = parseFloat(el.value).toFixed(id === 'lacunarity' ? 1 : 2);
    scheduleGenerate();
  });
}
['scale','octaves','persistence','lacunarity','elevationBias','elevationContrast','temperatureBias','temperatureContrast','moistureBias','moistureContrast'].forEach(bindRange);

// Build legend (swaps when view mode changes)
const legend = document.getElementById('legend');
function buildLegend() {
  legend.innerHTML = '';
  if (viewMode === 'level') {
    TIER_LABELS.slice(1).forEach((label, i) => {
      const tier = i + 1;
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-swatch" style="background:${TIER_COLORS[tier]}"></div><span>T${tier} ${label}</span>`;
      legend.appendChild(item);
    });
  } else {
    for (const [biome, color] of Object.entries(BIOME_COLORS)) {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-swatch" style="background:${color}"></div><span>${biome}</span>`;
      legend.appendChild(item);
    }
  }
}
buildLegend();

function buildQueryString() {
  const seedEl = document.getElementById('seed');
  if (!seedEl.value.trim()) seedEl.value = randomSeed();
  return new URLSearchParams({
    seed:              seedEl.value.trim(),
    cols:              document.getElementById('cols').value,
    rows:              document.getElementById('rows').value,
    scale:             document.getElementById('scale').value,
    octaves:           document.getElementById('octaves').value,
    persistence:       document.getElementById('persistence').value,
    lacunarity:        document.getElementById('lacunarity').value,
    boundaryStyle:     document.getElementById('boundaryStyle').value,
    elevationBias:     document.getElementById('elevationBias').value,
    elevationContrast: document.getElementById('elevationContrast').value,
    temperatureBias:   document.getElementById('temperatureBias').value,
    temperatureContrast: document.getElementById('temperatureContrast').value,
    moistureBias:      document.getElementById('moistureBias').value,
    moistureContrast:  document.getElementById('moistureContrast').value,
    cityCount:         document.getElementById('cityCount').value,
    villageCount:      document.getElementById('villageCount').value,
    progressionMode:   document.getElementById('progressionMode').value,
    progressionDir:    document.getElementById('progressionDir').value,
    overrides:         JSON.stringify([...overrides.values()]),
  });
}

async function generate() {
  const status = document.getElementById('status');
  status.textContent = 'Generating…';

  const params = buildQueryString();

  try {
    const res = await fetch('/api/world-gen?' + params);
    world = await res.json();
    autoFitZoom(world);
    render(world);
    status.textContent = `${world.cols}×${world.rows} grid · seed "${world.seed}"`;
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
}

function render(world) {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  renderWorldGrid(canvas, ctx, world, cellPx(), { viewMode });
}

const canvas = document.getElementById('canvas');
const tooltip = document.getElementById('tooltip');
const cellInfo = document.getElementById('cell-info');

canvas.addEventListener('mousemove', (e) => {
  if (mode === 'wild') { wildMouseMove(e); return; }
  if (!world) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const px = cellPx();
  const col = Math.floor((e.clientX - rect.left) * scaleX / px);
  const row = Math.floor((e.clientY - rect.top)  * scaleY / px);
  if (row < 0 || row >= world.rows || col < 0 || col >= world.cols) {
    tooltip.style.display = 'none';
    return;
  }
  const cell = world.cells[row][col];

  // Find any settlement at this cell.
  const allSettlements = [...(world.settlements ?? []), ...(world.cities ?? [])];
  const settlement = allSettlements.find(s => s.gridX === col && s.gridY === row);

  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top  = (e.clientY + 14) + 'px';
  const lb = cell.levelBand;
  const lines = [
    `<b style="color:#e94560">${cell.worldBiome}</b>`,
    `grid (${col}, ${row})`,
    `temp      ${cell.temperature?.toFixed(3) ?? '—'}`,
    `moisture  ${cell.moisture?.toFixed(3) ?? '—'}`,
    `elevation ${cell.elevation?.toFixed(3) ?? '—'}`,
    `danger    ${cell.danger?.toFixed(3) ?? '—'}`,
    lb ? `tier ${lb.tier}  lv ${lb.minLevel}–${lb.maxLevel}` : '',
    cell.tags?.length ? `tags      ${cell.tags.join(', ')}` : '',
    `seed      ${cell.seed}`,
  ].filter(Boolean);
  if (settlement) {
    const style = SETTLEMENT_STYLE[settlement.type] ?? SETTLEMENT_STYLE.village;
    const modStr = settlement.modifier ? ` [${settlement.modifier}]` : '';
    lines.push(`<b style="color:${style.fill}">⬛ ${settlement.type}${modStr}</b>`);
  }
  tooltip.innerHTML = lines.join('<br>');
  const modStr = settlement?.modifier ? ` [${settlement.modifier}]` : '';
  cellInfo.textContent = `(${col}, ${row}) ${cell.worldBiome}${settlement ? ` · ${settlement.type}${modStr}` : ''}`;
});

canvas.addEventListener('mouseleave', () => {
  tooltip.style.display = 'none';
  cellInfo.textContent = '';
});

// ── Cell override editor ────────────────────────────────────────────────────────
const cellEditor = document.getElementById('cell-editor');
let editingCell = null; // { x, y }

function cellAtEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const px = cellPx();
  const col = Math.floor((e.clientX - rect.left) * scaleX / px);
  const row = Math.floor((e.clientY - rect.top)  * scaleY / px);
  if (row < 0 || row >= world.rows || col < 0 || col >= world.cols) return null;
  return { x: col, y: row };
}

function openCellEditor(x, y, clientX, clientY) {
  editingCell = { x, y };
  const existing = overrides.get(`${x}_${y}`) ?? {};
  const cell = world.cells[y][x];
  document.getElementById('cell-editor-title').textContent = `Cell (${x}, ${y})`;
  document.getElementById('ce-biome').value = existing.biome ?? '';
  document.getElementById('ce-tier').value  = existing.tier != null ? String(existing.tier) : '';
  // Pre-fill levels from the override, else the cell's current resolved band as a hint.
  document.getElementById('ce-min').value = existing.minLevel ?? cell.levelBand?.minLevel ?? '';
  document.getElementById('ce-max').value = existing.maxLevel ?? cell.levelBand?.maxLevel ?? '';
  cellEditor.style.display = 'block';
  // Keep the editor on-screen.
  const w = 200, h = cellEditor.offsetHeight || 220;
  cellEditor.style.left = Math.min(clientX + 14, window.innerWidth  - w - 8) + 'px';
  cellEditor.style.top  = Math.min(clientY + 14, window.innerHeight - h - 8) + 'px';
}

function closeCellEditor() {
  cellEditor.style.display = 'none';
  editingCell = null;
}

canvas.addEventListener('click', (e) => {
  if (mode === 'wild') { wildClickToPan(e); return; }
  if (!world) return;
  const c = cellAtEvent(e);
  if (!c) return;
  tooltip.style.display = 'none';
  openCellEditor(c.x, c.y, e.clientX, e.clientY);
});

document.getElementById('ce-apply').addEventListener('click', () => {
  if (!editingCell) return;
  const biome = document.getElementById('ce-biome').value;
  const tierRaw = document.getElementById('ce-tier').value;
  const minRaw = document.getElementById('ce-min').value;
  const maxRaw = document.getElementById('ce-max').value;
  const o = { x: editingCell.x, y: editingCell.y };
  if (biome) o.biome = biome;
  if (tierRaw) o.tier = Number(tierRaw);
  if (minRaw !== '') o.minLevel = Number(minRaw);
  if (maxRaw !== '') o.maxLevel = Number(maxRaw);
  const key = `${editingCell.x}_${editingCell.y}`;
  // Store only if something beyond x/y is set; otherwise treat as a clear.
  if (Object.keys(o).length > 2) overrides.set(key, o);
  else overrides.delete(key);
  updateOverrideInfo();
  closeCellEditor();
  generate();
});

document.getElementById('ce-clear').addEventListener('click', () => {
  if (!editingCell) return;
  overrides.delete(`${editingCell.x}_${editingCell.y}`);
  updateOverrideInfo();
  closeCellEditor();
  generate();
});

document.getElementById('ce-close').addEventListener('click', closeCellEditor);

document.getElementById('generate').addEventListener('click', generate);

document.getElementById('export-btn').addEventListener('click', async () => {
  const status = document.getElementById('export-status');

  status.textContent = 'Exporting…';

document.getElementById('export-yaml-btn').addEventListener('click', async () => {

  status.style.color = '#aaa';
  status.textContent = 'Exporting YAML…';

// Progression mode toggle — show the direction picker only for linear mode.
const progressionModeEl = document.getElementById('progressionMode');
const progressionDirLabel = document.getElementById('progressionDir-label');
function syncProgressionDir() {
  progressionDirLabel.style.display = progressionModeEl.value === 'linear' ? 'flex' : 'none';
}
progressionModeEl.addEventListener('change', () => { syncProgressionDir(); scheduleGenerate(); });
document.getElementById('progressionDir').addEventListener('change', scheduleGenerate);
syncProgressionDir();

document.getElementById('randomize-btn').addEventListener('click', () => {
  document.getElementById('seed').value = randomSeed();
  generate();
});
document.getElementById('zoom-in').addEventListener('click', () => applyZoom(+1));
document.getElementById('zoom-out').addEventListener('click', () => applyZoom(-1));
document.getElementById('zoom-reset').addEventListener('click', () => {
  zoomIdx = ZOOM_STEPS.indexOf(1);
  updateZoomLabel();
  if (world) render(world);
});

// Scroll wheel zoom on the canvas
const canvasWrap = document.getElementById('canvas-wrap');
canvasWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (mode === 'wild') { wildZoom(e.deltaY < 0 ? 0.8 : 1.25); return; }
  applyZoom(e.deltaY < 0 ? +1 : -1);
}, { passive: false });

// Regenerate on Enter in text/number inputs; on change for select
['seed','cols','rows','cityCount','villageCount'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
  document.getElementById(id).addEventListener('change', scheduleGenerate);
});
document.getElementById('boundaryStyle').addEventListener('change', scheduleGenerate);

// View mode toggle
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

// ── Saved defaults ────────────────────────────────────────────────────────────
const DEFAULTS_KEY = 'worldgen_defaults';
const SAVEABLE = ['seed','cols','rows','scale','octaves','persistence','lacunarity',
                  'elevationBias','elevationContrast','temperatureBias','temperatureContrast','moistureBias','moistureContrast'];
const RANGE_IDS = new Set(['scale','octaves','persistence','lacunarity',
                           'elevationBias','elevationContrast','temperatureBias','temperatureContrast','moistureBias','moistureContrast']);

function saveDefaults() {
  const vals = {};
  for (const id of SAVEABLE) vals[id] = document.getElementById(id).value;
  localStorage.setItem(DEFAULTS_KEY, JSON.stringify(vals));
  const status = document.getElementById('export-status');
  status.style.color = '#2ecc71';
  status.textContent = 'Defaults saved.';
  setTimeout(() => { if (status.textContent === 'Defaults saved.') status.textContent = ''; }, 2000);
}

function loadDefaults() {
  const raw = localStorage.getItem(DEFAULTS_KEY);
  if (!raw) return false;
  try {
    const vals = JSON.parse(raw);
    for (const id of SAVEABLE) {
      if (vals[id] === undefined) continue;
      const el = document.getElementById(id);
      el.value = vals[id];
      if (RANGE_IDS.has(id)) {
        const valEl = document.getElementById(id + '-val');
        if (valEl) valEl.textContent = parseFloat(vals[id]).toFixed(id === 'lacunarity' ? 1 : 2);
      }
    }
    return true;
  } catch { return false; }
}

document.getElementById('save-defaults-btn').addEventListener('click', saveDefaults);

// ── Continuous Wild mode — visualizes shared/worldgen (field.ts + atlas.ts),
// the pointwise generator the live game actually uses, as opposed to the
// zone-grid model above (server/game/mapgen/worldgen.ts). ─────────────────────
const WILD_BIOME_ORDER = ['ocean', 'tundra', 'plains', 'grassland', 'forest', 'swamp', 'desert', 'mountain', 'badlands'];
let mode = 'zone'; // 'zone' | 'wild'
let wildData = null; // last /api/wild-gen response, byte arrays decoded
let wildViewMode = 'biome'; // 'biome' | 'danger' | 'weird'

// Weirdness gradient: negative (blighted) → 0 (unremarkable, grey) → positive
// (lush). Symmetric around 0 so the fold's zero-crossings are visible.
const WEIRD_GRADIENT_STOPS = [
  [-1.0, [155, 45, 30]],   // blighted
  [ 0.0, [90, 90, 90]],    // unremarkable
  [ 1.0, [45, 155, 90]],   // lush
];
function weirdColor(w) {
  w = Math.max(-1, Math.min(1, w));
  for (let i = 1; i < WEIRD_GRADIENT_STOPS.length; i++) {
    const [t0, c0] = WEIRD_GRADIENT_STOPS[i - 1];
    const [t1, c1] = WEIRD_GRADIENT_STOPS[i];
    if (w <= t1) {
      const f = (w - t0) / (t1 - t0);
      return c0.map((v, k) => Math.round(v + (c1[k] - v) * f));
    }
  }
  return WEIRD_GRADIENT_STOPS[WEIRD_GRADIENT_STOPS.length - 1][1];
}

const WILD_BAND_COUNT = 20; // must match LEVEL_BAND_COUNT in shared/worldgen/field.ts
const WILD_BAND_WIDTH = 5;  // must match LEVEL_BAND_WIDTH

function dangerToTier(d) {
  return Math.min(WILD_BAND_COUNT - 1, Math.floor(d * WILD_BAND_COUNT)) + 1;
}

// Continuous gradient (green → yellow → orange → red → purple) across the 20
// bands, since a discrete per-tier palette doesn't scale past a handful of colors.
const DANGER_GRADIENT_STOPS = [
  [0.00, [46, 204, 113]],   // T1  — green
  [0.25, [241, 196, 15]],   // T5  — yellow
  [0.50, [230, 126, 34]],   // T10 — orange
  [0.75, [231, 76, 60]],    // T15 — red
  [1.00, [142, 68, 173]],   // T20 — purple
];
function dangerColor(d) {
  d = Math.max(0, Math.min(1, d));
  for (let i = 1; i < DANGER_GRADIENT_STOPS.length; i++) {
    const [t0, c0] = DANGER_GRADIENT_STOPS[i - 1];
    const [t1, c1] = DANGER_GRADIENT_STOPS[i];
    if (d <= t1) {
      const f = (d - t0) / (t1 - t0);
      return c0.map((v, k) => Math.round(v + (c1[k] - v) * f));
    }
  }
  return DANGER_GRADIENT_STOPS[DANGER_GRADIENT_STOPS.length - 1][1];
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function wildDisplaySize() {
  return Math.max(64, Math.min(1200, window.innerWidth - 260 - 32, window.innerHeight - 28 - 32));
}

const WILD_FIELD_PARAM_IDS = [
  'elevScale', 'climateScale', 'octaves', 'persistence', 'lacunarity',
  'elevBias', 'elevContrast', 'tempBias', 'tempContrast', 'moistBias', 'moistContrast',
  'weirdScale', 'weirdThreshold',
];

function wildFieldParams() {
  const out = {};
  for (const key of WILD_FIELD_PARAM_IDS) out[key] = document.getElementById('wild-' + key).value;
  return out;
}

async function generateWild() {
  const status = document.getElementById('status');
  status.textContent = 'Sampling field…';
  const seed = document.getElementById('wild-seed').value.trim() || 'silicon-soup';
  const cx = Number(document.getElementById('wild-cx').value) || 0;
  const cy = Number(document.getElementById('wild-cy').value) || 0;
  const radius = Math.max(4, Number(document.getElementById('wild-radius').value) || 500);
  const samples = Number(document.getElementById('wild-samples').value) || 512;
  try {
    const qs = new URLSearchParams({ seed, cx, cy, radius, samples, ...wildFieldParams() });
    const res = await fetch('/api/wild-gen?' + qs);
    const data = await res.json();
    wildData = {
      ...data,
      biomeBytes: base64ToBytes(data.biomeBytes),
      dangerBytes: base64ToBytes(data.dangerBytes),
      weirdBytes: base64ToBytes(data.weirdBytes),
    };
    renderWild();
    status.textContent = `wild ${samples}×${samples} samples · center (${cx}, ${cy}) · radius ${radius} · seed "${seed}"`;
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
}

function renderWild() {
  if (!wildData) return;
  const { samples, biomeBytes, dangerBytes, weirdBytes } = wildData;

  const off = document.createElement('canvas');
  off.width = samples; off.height = samples;
  const octx = off.getContext('2d');
  const img = octx.createImageData(samples, samples);
  for (let i = 0; i < samples * samples; i++) {
    let r, g, b;
    if (wildViewMode === 'danger') {
      [r, g, b] = dangerColor(dangerBytes[i] / 255);
    } else if (wildViewMode === 'weird') {
      [r, g, b] = weirdColor(weirdBytes[i] / 127.5 - 1);
    } else {
      [r, g, b] = hexToRgb(BIOME_COLORS[WILD_BIOME_ORDER[biomeBytes[i]]] || '#333');
    }
    const p = i * 4;
    img.data[p] = r; img.data[p + 1] = g; img.data[p + 2] = b; img.data[p + 3] = 255;
  }
  octx.putImageData(img, 0, 0);

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const size = wildDisplaySize();
  canvas.width = size; canvas.height = size;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, samples, samples, 0, 0, size, size);

  const { cx, cy, radius } = wildData;
  const worldToScreen = (wx, wy) => [
    ((wx - (cx - radius)) / (radius * 2)) * size,
    ((wy - (cy - radius)) / (radius * 2)) * size,
  ];

  const [ox, oy] = worldToScreen(0, 0);
  if (ox >= 0 && ox <= size && oy >= 0 && oy <= size) {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ox - 8, oy); ctx.lineTo(ox + 8, oy);
    ctx.moveTo(ox, oy - 8); ctx.lineTo(ox, oy + 8);
    ctx.stroke();
  }

  for (const s of wildData.settlements) {
    const [sx, sy] = worldToScreen(s.portalX, s.portalY);
    if (sx < 0 || sx > size || sy < 0 || sy > size) continue;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(sx, sy, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function wildMouseMove(e) {
  if (!wildData) return;
  const canvas = document.getElementById('canvas');
  const rect = canvas.getBoundingClientRect();
  const size = wildDisplaySize();
  const { samples, biomeBytes, dangerBytes, weirdBytes, cx, cy, radius } = wildData;
  const px = Math.floor(((e.clientX - rect.left) / rect.width) * samples);
  const py = Math.floor(((e.clientY - rect.top) / rect.height) * samples);
  if (px < 0 || px >= samples || py < 0 || py >= samples) { tooltip.style.display = 'none'; return; }
  const step = (radius * 2) / samples;
  const wx = Math.round(cx - radius + px * step);
  const wy = Math.round(cy - radius + py * step);
  const idx = py * samples + px;
  const danger = dangerBytes[idx] / 255;
  const weird = weirdBytes[idx] / 127.5 - 1;
  const biome = WILD_BIOME_ORDER[biomeBytes[idx]];

  tooltip.style.display = 'block';
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top = (e.clientY + 14) + 'px';
  tooltip.innerHTML = [
    `<b style="color:#e94560">${biome}</b>`,
    `world (${wx}, ${wy})`,
    `danger ${danger.toFixed(3)}  T${dangerToTier(danger)}`,
    `weird ${weird.toFixed(3)}`,
  ].join('<br>');
  cellInfo.textContent = `(${wx}, ${wy}) ${biome} · danger ${danger.toFixed(2)} · weird ${weird.toFixed(2)}`;
}

function wildClickToPan(e) {
  if (!wildData) return;
  const canvas = document.getElementById('canvas');
  const rect = canvas.getBoundingClientRect();
  const { samples, cx, cy, radius } = wildData;
  const px = ((e.clientX - rect.left) / rect.width) * samples;
  const py = ((e.clientY - rect.top) / rect.height) * samples;
  const step = (radius * 2) / samples;
  const wx = Math.round(cx - radius + px * step);
  const wy = Math.round(cy - radius + py * step);
  document.getElementById('wild-cx').value = wx;
  document.getElementById('wild-cy').value = wy;
  generateWild();
}

function wildZoom(factor) {
  const el = document.getElementById('wild-radius');
  el.value = Math.round(Math.min(100000, Math.max(4, Number(el.value) * factor)));
  generateWild();
}

function buildWildLegend() {
  const legend = document.getElementById('wild-legend');
  legend.innerHTML = '';
  if (wildViewMode === 'danger') {
    const bar = document.createElement('canvas');
    bar.width = 220; bar.height = 14;
    bar.style.display = 'block'; bar.style.borderRadius = '2px';
    const bctx = bar.getContext('2d');
    const img = bctx.createImageData(220, 14);
    for (let x = 0; x < 220; x++) {
      const [r, g, b] = dangerColor(x / 219);
      for (let y = 0; y < 14; y++) {
        const p = (y * 220 + x) * 4;
        img.data[p] = r; img.data[p + 1] = g; img.data[p + 2] = b; img.data[p + 3] = 255;
      }
    }
    bctx.putImageData(img, 0, 0);
    const labels = document.createElement('div');
    labels.style.cssText = 'display:flex;justify-content:space-between;font-size:10px;color:#aaa;margin-top:3px;';
    labels.innerHTML = '<span>lv 1</span><span>lv 100</span>';
    legend.appendChild(bar);
    legend.appendChild(labels);
  } else if (wildViewMode === 'weird') {
    const bar = document.createElement('canvas');
    bar.width = 220; bar.height = 14;
    bar.style.display = 'block'; bar.style.borderRadius = '2px';
    const bctx = bar.getContext('2d');
    const img = bctx.createImageData(220, 14);
    for (let x = 0; x < 220; x++) {
      const [r, g, b] = weirdColor((x / 219) * 2 - 1);
      for (let y = 0; y < 14; y++) {
        const p = (y * 220 + x) * 4;
        img.data[p] = r; img.data[p + 1] = g; img.data[p + 2] = b; img.data[p + 3] = 255;
      }
    }
    bctx.putImageData(img, 0, 0);
    const labels = document.createElement('div');
    labels.style.cssText = 'display:flex;justify-content:space-between;font-size:10px;color:#aaa;margin-top:3px;';
    labels.innerHTML = '<span>blighted (-1)</span><span>lush (+1)</span>';
    legend.appendChild(bar);
    legend.appendChild(labels);
    const note = document.createElement('div');
    note.style.cssText = 'font-size:10px;color:#888;margin-top:4px;';
    note.textContent = 'Sign flavors vegetation density; |weird| past the threshold overrides with badlands.';
    legend.appendChild(note);
  } else {
    for (const biome of WILD_BIOME_ORDER) {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<div class="legend-swatch" style="background:${BIOME_COLORS[biome]}"></div><span>${biome}</span>`;
      legend.appendChild(item);
    }
  }
}

async function buildWildBandLegend() {
  try {
    const res = await fetch('/api/wild-bands');
    const data = await res.json();
    const el = document.getElementById('wild-band-legend');
    // 20 bands is too many rows for the sidebar — sample every 4th (5 rows).
    const shown = data.bands.filter((_, i) => i % 4 === 0);
    el.innerHTML = shown.map((b) => {
      const [r, g, ble] = dangerColor(b.danger);
      return `<span style="font-size:10px;color:rgb(${r},${g},${ble});white-space:nowrap;display:block">T${b.tier} @ ${b.distance}+ tiles (lv ${b.minLevel}–${b.maxLevel})</span>`;
    }).join('') + `<span style="font-size:10px;color:#888;display:block;margin-top:2px;">${data.bandCount} bands total, ${data.bands[0].maxLevel - data.bands[0].minLevel + 1} levels each</span>`;
  } catch { /* legend is best-effort */ }
}

function setMode(m) {
  mode = m;
  document.getElementById('mode-zone').classList.toggle('active', m === 'zone');
  document.getElementById('mode-wild').classList.toggle('active', m === 'wild');
  document.getElementById('zone-controls').style.display = m === 'zone' ? 'contents' : 'none';
  document.getElementById('wild-controls').style.display = m === 'wild' ? 'flex' : 'none';
  tooltip.style.display = 'none';
  if (m === 'wild') {
    if (!wildData) generateWild(); else renderWild();
  } else if (world) {
    autoFitZoom(world);
    render(world);
  }
}

document.getElementById('mode-zone').addEventListener('click', () => setMode('zone'));
document.getElementById('mode-wild').addEventListener('click', () => setMode('wild'));
document.getElementById('wild-samples').addEventListener('input', (e) => {
  document.getElementById('wild-samples-val').textContent = e.target.value;
});
document.getElementById('wild-generate').addEventListener('click', generateWild);
document.getElementById('wild-origin-btn').addEventListener('click', () => {
  document.getElementById('wild-cx').value = 0;
  document.getElementById('wild-cy').value = 0;
  generateWild();
});
['wild-seed', 'wild-cx', 'wild-cy', 'wild-radius'].forEach((id) => {
  document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') generateWild(); });
});
const WILD_VIEW_MODES = ['biome', 'danger', 'weird'];
WILD_VIEW_MODES.forEach((m) => {
  document.getElementById('wild-view-' + m).addEventListener('click', () => {
    wildViewMode = m;
    WILD_VIEW_MODES.forEach((other) => document.getElementById('wild-view-' + other).classList.toggle('active', other === m));
    buildWildLegend();
    renderWild();
  });
});
window.addEventListener('resize', () => { if (mode === 'wild' && wildData) renderWild(); });

// ── Wild noise sliders ──────────────────────────────────────────────────────
const scheduleGenerateWild = debounce(() => generateWild(), 180);
const WILD_INT_PARAMS = new Set(['octaves']);
const WILD_1DP_PARAMS = new Set(['lacunarity']);
function wildSliderDecimals(key) {
  if (WILD_INT_PARAMS.has(key)) return 0;
  if (WILD_1DP_PARAMS.has(key)) return 1;
  return 2;
}
function applyFieldParamsToSliders(params) {
  for (const key of WILD_FIELD_PARAM_IDS) {
    if (params[key] === undefined) continue;
    document.getElementById('wild-' + key).value = params[key];
    document.getElementById('wild-' + key + '-val').textContent = Number(params[key]).toFixed(wildSliderDecimals(key));
  }
}
WILD_FIELD_PARAM_IDS.forEach((key) => {
  const el = document.getElementById('wild-' + key);
  el.addEventListener('input', () => {
    document.getElementById('wild-' + key + '-val').textContent = Number(el.value).toFixed(wildSliderDecimals(key));
    scheduleGenerateWild();
  });
});

let wildShippedDefaults = null;
async function loadWildDefaults() {
  try {
    const res = await fetch('/api/wild-defaults');
    wildShippedDefaults = await res.json();
    applyFieldParamsToSliders(wildShippedDefaults);
  } catch { /* keep HTML slider defaults if this fails */ }
}

document.getElementById('wild-reset-defaults-btn').addEventListener('click', () => {
  if (wildShippedDefaults) applyFieldParamsToSliders(wildShippedDefaults);
  generateWild();
});

document.getElementById('wild-copy-config-btn').addEventListener('click', async () => {
  const p = wildFieldParams();
  const snippet = [
    `export const ELEV_SCALE = ${p.elevScale};`,
    `export const CLIMATE_SCALE = ${p.climateScale};`,
    ``,
    `export const NOISE_OCTAVES = ${p.octaves};`,
    `export const NOISE_PERSISTENCE = ${p.persistence};`,
    `export const NOISE_LACUNARITY = ${p.lacunarity};`,
    ``,
    `export const ELEVATION_BIAS = ${p.elevBias};`,
    `export const ELEVATION_CONTRAST = ${p.elevContrast};`,
    `export const TEMPERATURE_BIAS = ${p.tempBias};`,
    `export const TEMPERATURE_CONTRAST = ${p.tempContrast};`,
    `export const MOISTURE_BIAS = ${p.moistBias};`,
    `export const MOISTURE_CONTRAST = ${p.moistContrast};`,
    ``,
    `export const WEIRDNESS_SCALE = ${p.weirdScale};`,
    `export const WEIRDNESS_THRESHOLD = ${p.weirdThreshold};`,
  ].join('\n');
  const status = document.getElementById('wild-copy-status');
  try {
    await navigator.clipboard.writeText(snippet);
    status.style.color = '#2ecc71';
    status.textContent = 'Copied — paste into shared/worldgen/config.ts';
  } catch {
    status.style.color = '#aaa';
    status.textContent = snippet;
  }
});

buildWildLegend();
buildWildBandLegend();
loadWildDefaults();

// Auto-generate on load — use saved defaults if present, otherwise randomize seed
const hadSaved = loadDefaults();
if (!hadSaved) document.getElementById('seed').value = randomSeed();
drawBiomeTable();
generate();
</script>
